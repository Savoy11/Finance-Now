# Dependabot — monthly dependency updates.
#
# ── Cadence changed weekly -> monthly, 2026-09-22 (owner request) ────────────
#
# The argument is this file's own: "Ungrouped, this repo would open ~15 PRs a
# week across four ecosystems and they would be ignored, which is worse than not
# running it." Grouping fixed the volume; the CADENCE reproduced the problem more
# slowly. Measured on 2026-09-22: ten open dependabot PRs, the oldest six of them
# raised 2026-09-14 and still unread eight days later — including four majors
# (tailwindcss 3->4, eslint 9->10, zustand 4->5, @vitest/coverage-v8 3->5) that
# the ungrouping exists specifically to make someone read.
#
# ⚠ THIS DOES NOT SLOW SECURITY FIXES, and that is the only objection worth
# answering. `schedule` governs VERSION updates only. Dependabot SECURITY updates
# are driven by repository alerts and ignore this file's `updates:` blocks
# entirely — which is demonstrable here rather than theoretical: #213 (cryptography
# 49 -> 50, changelog opening "SECURITY ISSUE") was raised on 2026-09-20, six days
# AFTER the pip ecosystem watching /backend was removed on 2026-09-14 (#193). The
# removal worked exactly as intended for version updates and never applied to the
# security path.
#
# `day:` is dropped because it is a weekly-only key; monthly runs on the 1st.
# That decouples the batch from the Monday/Tuesday pairing the triage workflow
# was built around — harmless, because dependabot-triage.yml runs weekly and
# exits before any Anthropic call when there is nothing open, so it simply finds
# the batch within a week of it landing. Its Tuesday cadence is owner decision D6
# and is deliberately NOT changed here.
#
# To go back: restore `interval: weekly` + `day: monday` on all four ecosystems.
#
# Added 2026-07-28, closing the last unticked item in docs/architecture/security.md
# that was actionable from the repo. The week that preceded it is the argument for
# it: three critical advisories (@auth/core, next-auth, and a CVSS 9.1 Next.js
# middleware authorization bypass) sat in the tree until someone ran `npm audit`
# by hand. Every one of them would have arrived as a PR.
#
# Grouping is deliberate. Ungrouped, this repo would open ~15 PRs a week across
# four ecosystems and they would be ignored, which is worse than not running it.
# Patch and minor updates are batched per ecosystem; majors come through on their
# own because they are the ones that need reading.

version: 2

updates:
  # ── Frontend (Next.js app) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Next majors are a migration, not an update — 14 -> 15 needed async
      # `params` changes across six files and a postcss override. Track those
      # deliberately rather than as a surprise PR.
      - dependency-name: next
        update-types: [version-update:semver-major]
      # React majors drag the whole chart/UI stack (recharts, lightweight-charts)
      # with them.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # ── MCP server ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      mcp-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Backend (Poetry) — REMOVED 2026-09-15 (owner decision D2) ─────────────
  #
  # The pip ecosystem watching /backend is gone because the FastAPI backend is
  # retired. `backend/` is FROZEN in place, not deleted (backend/FROZEN.md), and
  # since #192 no CI job lints, tests or builds it — so a dependency bump there
  # protects nothing, cannot be verified by anything, and lands on a service that
  # is not running.
  #
  # ⚠ Removing the entry is the POINT, not a side effect. #189 and #190 were
  # closed on 2026-09-15 as moot under D2, and closing a dependabot PR without
  # also changing the config or adding an ignore is precisely what this file
  # already records going wrong: redis 5 -> 8 was declined on #59, no rule was
  # added, and #97 raised the identical bump. Weekly PRs against a frozen
  # directory would have repeated that indefinitely.
  #
  # The redis decision this block used to carry, preserved so retiring the entry
  # does not quietly discard it: redis 5 -> 8 was declined TWICE on the reasoning
  # in docs/TASK-QUEUE.md — a green CI run on a runtime client major mostly
  # proves the library IMPORTS, not that it BEHAVES. If the backend is ever
  # revived, that upgrade still wants doing deliberately, with something
  # exercising the client against a real Redis, rather than read off a green
  # import.
  #
  # TO RESTORE: reinstate a `package-ecosystem: pip` block for /backend with the
  # weekly schedule, the `backend-patch-minor` group, and the redis majors-only
  # ignore — and restore the backend CI jobs first, or the bumps arrive with
  # nothing to verify them.

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # The CI logs already carry deprecation warnings for actions pinned to Node 20
  # runtimes; this is how those stop accumulating silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # ── Docker base image ─────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
