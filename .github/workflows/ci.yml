name: CI — Test, Lint & Build

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # main is included so a merged commit is verified in its own right. The PR
    # gate checks the merge preview, not what actually lands, and nothing else
    # re-runs on main — so without this a bad interaction between two PRs that
    # were each green alone reaches main unnoticed.
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

###############################################################################
# Jobs
###############################################################################

jobs:

  # ─── Backend jobs REMOVED 2026-09-14 (owner decision D2) ───────────────
  #
  # `backend-lint` (ruff + mypy) and `backend-test` (pytest + coverage, with its
  # Postgres and Redis services) are gone because the FastAPI backend is retired.
  #
  # The directory is FROZEN, not deleted — see backend/FROZEN.md for what was kept,
  # why, and what reviving it would require. Nothing in the shipping app has called
  # it since the M8 sweep removed the frontend's axios client.
  #
  # If you restore these jobs, you must also re-add them to the ci-success gate's
  # `needs:` list AND its `check` calls at the bottom of this file. A job that is
  # needed but never checked makes the gate WAIT for a result it then ignores —
  # that exact bug shipped here once already (see the note on the gate).

  # ─── Frontend: Lint & Type Check ──────────────────────────────────────────
  frontend-check:
    name: Frontend Check (ESLint + TypeScript + Tests + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24 "Krypton" is the current LTS line. Keep in step with
          # frontend/Dockerfile and package.json `engines` — CI must run the
          # runtime the image ships, or neither is really tested.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Run ESLint
        run: |
          cd frontend
          # Two runs on purpose: the first writes SARIF for code scanning and
          # must NOT fail the job (otherwise a lint error means no upload), the
          # second is the actual gate.
          #
          # `|| true` used to hide more than that. @microsoft/eslint-formatter-sarif
          # was never in the lockfile, so this line failed every run, the `|| true`
          # swallowed it, and the upload step below — `continue-on-error: true` —
          # swallowed the missing file. ESLint results silently never reached code
          # scanning. The package is a devDependency now; this check makes a repeat
          # loud instead of invisible.
          npm run lint -- --format=@microsoft/eslint-formatter-sarif --output-file=eslint-results.sarif || true
          test -s eslint-results.sarif || { echo "::error::SARIF report was not produced — the formatter is missing or failed"; exit 1; }
          npm run lint

      - name: Upload ESLint SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: frontend/eslint-results.sarif
          category: eslint
        continue-on-error: true

      - name: TypeScript type check
        run: |
          cd frontend
          npm run type-check

      # Runs BEFORE the build: the suite takes seconds and the build takes over a
      # minute, so a logic regression should not wait on a bundle to be reported.
      #
      # This is a step inside frontend-check rather than its own job on purpose.
      # The ci-success gate is `if: always()` and checks each job's result by
      # name, so a new job that is added to `needs:` but missed in the check
      # block — or vice versa — passes silently. A step in an already-gated job
      # cannot be un-gated by omission.
      #
      # Until 2026-08-08 CI never ran these tests at all. The frontend suite
      # (587 tests) executed only when someone ran it locally, which meant the
      # source-terms enforcement in lib/server/__tests__/sourceTerms.test.ts —
      # the check that fails the build when a data source is unregistered or
      # prohibited — could not fail anything. A well-written checker that never
      # runs is indistinguishable from no checker.
      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      # Two separate guarantees, both previously unenforced.
      #
      # 1. --verify fails when a /live-data route fetches a host the registry
      #    does not name. This is the gap the source-terms test cannot cover:
      #    that test walks the hosts IN dataSources.ts, so a host nobody
      #    declared is invisible to it. Until 2026-08-08 --verify printed its
      #    findings and exited 0, so it gated nothing either.
      #
      # 2. DATA-SOURCES.md is generated, never hand-edited, and drifts silently
      #    when someone adds a registry entry without regenerating — it was two
      #    surfaces stale when this step was written. The `-I` skips the
      #    "Last generated" stamp, which changes daily and would otherwise fail
      #    this every day after the commit.
      - name: Data-source registry ↔ route code
        run: |
          cd frontend
          npm run data-sources -- --verify
          cd ..
          git diff --exit-code -I'^_Last generated' DATA-SOURCES.md \
            || { echo "::error::DATA-SOURCES.md is stale — run 'npm run data-sources' and commit the result"; exit 1; }

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENV: test
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 3

  # ─── Docker: Build Test ────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # Must match the Dockerfile's final stage name — there is no
          # "production" stage (F-C root cause).
          target: runner
          push: false
          tags: fn-frontend:ci-test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # build-args removed: the previous block used invalid "KEY: value"
          # mapping syntax (build-push-action requires KEY=value lines), and the
          # frontend Dockerfile declares no ARGs, so the values were unconsumed
          # anyway. This bug was unreachable while the target mismatch failed
          # the build first.


  # ─── Security: Dependency Scan ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      # GATING since 2026-09-08. The `|| true` meant this step reported and then
      # passed regardless, so two HIGH advisories (js-yaml CVE-2026-59870,
      # brace-expansion DoS) sat in the tree with a green Security Scan beside
      # them. A check that cannot fail is not a check.
      #
      # Threshold RAISED to `moderate` on 2026-09-17, because the reason for
      # `high` no longer holds. That reason was: the four remaining moderates
      # came from esbuild via drizzle-kit and clearing them needed a breaking
      # drizzle-kit downgrade, so gating on moderate would make the first
      # action be to disable the gate again. They are now cleared WITHOUT the
      # downgrade — an override scoped to @esbuild-kit/core-utils, which leaves
      # drizzle-kit's own esbuild alone (see frontend/package.json overrides and
      # docs/audits/dependency-alerts-2026-09-17.md). Both workspaces audit
      # clean, so `moderate` costs nothing today and catches the next one.
      #
      # Deliberately NOT `low`: the same argument that retired `high` applies
      # one notch down. A gate that goes red on a single low-severity transitive
      # advisory is a gate someone disables, and then nothing is checked at all.
      - name: Node.js dependency audit (frontend)
        run: |
          cd frontend
          npm audit --audit-level=moderate

      # mcp-server was audited by NOTHING until 2026-09-17 — no workflow in this
      # repo so much as named the directory. That is where 20 of the 26 alerts
      # in the 2026-09-16 sweep lived, and it is the workspace most likely to
      # drift: it is built once, rarely rebuilt, and its two direct dependencies
      # pull everything else transitively, so `npm audit` on the frontend says
      # nothing whatsoever about it.
      #
      # No `npm ci` needed: `npm audit` resolves from package-lock.json alone,
      # verified against this repo's own pre-fix lockfile — it reported all five
      # advisories and exited 1 on a bare directory containing nothing but the
      # two manifests. That also demonstrates this step fires rather than merely
      # passing quietly: the commit before it was added would have failed it.
      - name: Node.js dependency audit (mcp-server)
        run: |
          cd mcp-server
          npm audit --audit-level=moderate

  # ─── Infrastructure: Terraform Validate ───────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'

      - name: Terraform Format Check
        run: |
          cd infrastructure/terraform
          terraform fmt -check -recursive -diff

      - name: Terraform Init (backend disabled for validate-only)
        run: |
          cd infrastructure/terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infrastructure/terraform
          terraform validate

      - name: Run tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.50.0
      - run: |
          cd infrastructure/terraform
          tflint --init
          tflint --format compact || true

  # ─── Final Status Check ────────────────────────────────────────────────────
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - docker-build
      - security-scan
      - terraform-validate

    # `!cancelled()`, not `always()`. With always(), a run superseded by the next
    # push — this workflow sets `cancel-in-progress: true` above — still reached
    # this gate, which read a CANCELLED dependency as a failure and posted a red
    # "CI Success Gate" against the abandoned commit. That happened three times on
    # PR #153 alone, once with every step of the cancelled job having already
    # succeeded, so the red X said "docker-build failed" about a job that built
    # both images and passed its structure test.
    #
    # A spurious red X is indistinguishable from a real one — the same reasoning
    # that gated cd-staging.yml behind a repository variable rather than leaving
    # `main` permanently red. This still runs when a job FAILS, so the gate keeps
    # gating; it is skipped only when the run itself was abandoned, and a skipped
    # gate is the honest answer there: nothing was concluded.
    if: ${{ !cancelled() }}

    steps:
      - name: Check all jobs succeeded
        run: |
          status=0
          check() {
            if [[ "$2" != "success" ]]; then
              # Report the actual result. "failed" was wrong for a cancelled or
              # skipped job and sent at least one investigation down the wrong path.
              echo "::error::$1 did not succeed (result: $2)"
              status=1
            fi
          }
          # Reports every non-success before exiting, rather than stopping at the
          # first — with the old early exit, two broken jobs cost two CI cycles.
          check frontend-check    "${{ needs.frontend-check.result }}"
          check docker-build      "${{ needs.docker-build.result }}"
          # security-scan and terraform-validate were listed in `needs:` but never
          # checked, so the gate WAITED for them and then ignored what they said.
          # That silently undid two changes in this same PR: `npm audit
          # --audit-level=high` lost its `|| true` under the note "A check that
          # cannot fail is not a check" — and it still could not fail the gate —
          # while the EKS v20 migration edits three .tf files that
          # `terraform validate` and `fmt -check` guard. Both jobs already pass;
          # this makes their result count.
          check security-scan     "${{ needs.security-scan.result }}"
          check terraform-validate "${{ needs.terraform-validate.result }}"
          [[ $status -eq 0 ]] || exit 1
          echo "All CI checks passed!"
