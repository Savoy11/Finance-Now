[tool.poetry]
name = "finance-now-backend"
version = "1.0.0"
description = "Crypto Asset Evaluation Platform — backend API"
authors = ["Finance Now Engineering <engineering@financenow.example>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.140.13,<0.142.0"   # 0.140 drops starlette's upper bound, which is what lets
                        # starlette reach 1.3.1 (CVE-2026-54283). See audit follow-ups.
uvicorn = {extras = ["standard"], version = ">=0.29,<0.53"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = ">=0.29,<0.32"
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.2.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
httpx = ">=0.27,<0.29"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.32"  # 0.0.30+ needed: path traversal (CVE-2026-24486),
                              # header DoS (CVE-2026-42561), urlencoded DoS (CVE-2026-53539)
apscheduler = "^3.10.4"
numpy = ">=1.26,<3.0"
scipy = "^1.12.0"
pandas = "^2.2.0"
pyotp = "^2.9.0"
structlog = ">=24.1,<27.0"
prometheus-client = ">=0.20,<0.27"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = ">=0.23,<1.5"
pytest-cov = ">=5,<8"
httpx = ">=0.27,<0.29"
faker = "^24.0.0"
ruff = ">=0.3,<0.17"
mypy = ">=1.9,<3.0"
types-passlib = "^1.7.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N805"]

[tool.ruff.per-file-ignores]
# Package __init__ modules re-export their submodules' public names; those
# imports are intentional, not unused. Without this, `ruff --fix` silently
# strips the re-exports and breaks `from app.<pkg> import <name>`.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage floor lives HERE and nowhere else. It used to be 80 in this file
# while CI overrode it to 45, so a bare local `pytest` failed on the exact
# suite CI called green — the 80 was aspirational, set back when the suite
# couldn't run at all, and nothing measured it after the suite was fixed.
# Raise it with new tests, in one place; do not re-add a --cov-fail-under
# override to the CI workflow, or the two numbers will drift apart again.
#
# 2026-09-08: raised 45 → 55 on the back of 47 new tests over app/scoring
# (normalizer.py was at 0%; the four components at 28–45%; all five now 100%).
# Measured 49.92% → 57.31% WITHOUT a database — 15 API tests error out locally
# for want of Postgres and contribute nothing to that figure. CI has a Postgres
# service container and measured ~1.1pp higher than local on the same tree
# (51% vs 49.92%), so the true CI figure is expected around 58%.
#
# 55 is deliberately set under the LOWER of the two measurements, not between
# them: the floor has to hold for a developer running a bare `pytest` with no
# database, or it fails for a reason that has nothing to do with their change.
# A floor that trips on unrelated work gets raised by deleting it.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=55"

[tool.coverage.run]
omit = ["tests/*", "app/db/migrations/*"]
