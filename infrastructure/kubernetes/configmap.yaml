apiVersion: v1
kind: ConfigMap
metadata:
  name: fn-backend-config
  namespace: fn
  labels:
    app: fn-backend
    component: config
    app.kubernetes.io/name: fn
    app.kubernetes.io/component: backend
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  WORKERS: "4"
  WORKER_CONNECTIONS: "1000"
  MAX_REQUESTS: "10000"
  MAX_REQUESTS_JITTER: "1000"
  KEEPALIVE: "5"
  CORS_ORIGINS: "https://financenow.example.com,https://www.financenow.example.com"
  ALLOWED_HOSTS: "financenow.example.com,www.financenow.example.com,fn-backend.fn.svc.cluster.local"
  CACHE_TTL_SECONDS: "300"
  SCORING_CACHE_TTL_SECONDS: "60"
  PRICE_CACHE_TTL_SECONDS: "30"
  WEBSOCKET_PING_INTERVAL: "20"
  WEBSOCKET_PING_TIMEOUT: "10"
  MAX_WEBSOCKET_CONNECTIONS: "10000"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  DB_POOL_PRE_PING: "true"
  DB_POOL_RECYCLE: "3600"
  REDIS_MAX_CONNECTIONS: "100"
  REDIS_DECODE_RESPONSES: "true"
  COINGECKO_BASE_URL: "https://api.coingecko.com/api/v3"
  DEFILLAMA_BASE_URL: "https://api.llama.fi"
  CHAINLINK_FEED_REGISTRY: "0x47Fb2585D2C56Fe188D0E6ec628a38b74fCeeeDf"
  ALERT_EVALUATION_INTERVAL_SECONDS: "30"
  SCORING_UPDATE_INTERVAL_SECONDS: "300"
  PRICE_FETCH_INTERVAL_SECONDS: "60"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  HEALTH_CHECK_PATH: "/health"
  READINESS_CHECK_PATH: "/ready"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fn-frontend-config
  namespace: fn
  labels:
    app: fn-frontend
    component: config
data:
  NEXT_PUBLIC_ENV: "production"
  # Legacy backend origin. RETIRED 2026-09-14 (owner decision D2): the /api/*
  # proxy rewrite that consumed this was removed from next.config.mjs, and the
  # API_BASE_URL constant that exported it is gone, so NOTHING reads this value
  # and setting it has no effect (CLAUDE.md, README.md, backend/FROZEN.md).
  # The defensive suffix-stripping a previous version of this comment pointed at
  # went with the rewrite and does not exist. Kept as a bare origin, not deleted,
  # so a redeploy does not look like it silently lost a setting. If a proxy to a
  # backend ever returns: ORIGIN only, no /api or /api/v1 suffix — a suffix plus
  # an appended /api/:path is what produced /api/v1/api/... .
  NEXT_PUBLIC_API_URL: "https://financenow.example.com"
  NEXT_TELEMETRY_DISABLED: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fn-nginx-config
  namespace: fn
  labels:
    app: fn-nginx
    component: config
data:
  NGINX_WORKER_PROCESSES: "auto"
  NGINX_WORKER_CONNECTIONS: "4096"
  NGINX_KEEPALIVE_TIMEOUT: "75"
  NGINX_CLIENT_MAX_BODY_SIZE: "20m"
